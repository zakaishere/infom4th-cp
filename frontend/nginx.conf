# Serves the built UI and forwards /api to the backend, so the browser uses one origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Test-data uploads in the problem lab can be large.
    client_max_body_size 64m;

    # Behind a reverse proxy on the same machine or private network (host nginx for the
    # subdomain), take the visitor's address from X-Forwarded-For. Direct visitors come
    # from public addresses, which are not trusted, so they cannot fake their IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Language documentation: compressed copies are made at install time, so serving costs no CPU.
    # Doc folders are named after their version, so they never change and can be cached for good.
    location /refdocs/ {
        gzip_static on;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /refdocs/manifest.json {
        gzip_static on;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
