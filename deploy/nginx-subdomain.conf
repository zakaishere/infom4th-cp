# Host nginx for the subdomain -> the platform's website container on port 30000.
#
# 1. Replace arena.example.com with your subdomain (2 places).
# 2. sudo cp deploy/nginx-subdomain.conf /etc/nginx/sites-available/cp-arena.conf
#    sudo ln -s /etc/nginx/sites-available/cp-arena.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. HTTPS: sudo certbot --nginx -d arena.example.com
#    (certbot adds the 443 server block and the http -> https redirect by itself)

server {
    listen 80;
    listen [::]:80;
    server_name arena.example.com;

    # Problem test data uploads can be large.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:30000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The platform uses these to rate-limit each visitor separately.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
